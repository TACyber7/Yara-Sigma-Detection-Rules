title: Domain User Enumeration
id: f63e0242-7837-42e9-adac-b62a9f58f2e9
status: experimental
description: Discovery consists of techniques an adversary may use to gain knowledge about the system and internal network.

references:
    - https://attack.mitre.org/tactics/TA0007/
author: Tobias Castleberry
date: 2026-06-04
modified: 2026-06-04
tags:
    - attack.discovery
    - attack.t1087.002

logsource:
    category: process_creation
    product: windows
    service: sysmon

detection:
    selection_img:
        Image|endswith:
        - '\net.exe'
        - 'net1.exe'


    selection_cmd:
        CommandLine|contains|all:
        - 'user '
        - '/domain'

    selection_group:
        CommandLine|contains|all:
        - 'group'
        - '/domain'

    condition: selection_img and (selection_cmd or selection_group)


falsepositives:
    - Pentesting

level: High
